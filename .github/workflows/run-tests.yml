name: "Compatibility"

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3 AM UTC
  pull_request:
    types:
      - opened
      - closed
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  precondition:
    name: Check testing precondition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Get changed files
        id: changed-files-yaml
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            code:
              - test/**
              - .github/workflows/run-tests.yml
              - .github/workflows/run-tests-and-build-reusable.yml
              - .github/workflows/run-tests-dispatch.yml
              - src/**
              - Artifacts.toml
              - Project.toml
    outputs:
      code_changed: ${{ steps.changed-files-yaml.outputs.code_any_changed }}

  test-matrix:
    name: Run tests on multiple configurations
    if: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'integrate') }}
    uses: ./.github/workflows/run-tests-and-build-reusable.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        matlab-version: ['R2021b', 'R2022b', 'R2023b', 'R2024b', 'R2025b']
        julia-version: ['1.7', '1.8', '1.9', '1.10', '1.11', '1.12']
        os: ['windows-latest', 'ubuntu-24.04']
    with:
      os: ${{ matrix.os }}
      matlab-version: ${{ matrix.matlab-version }}
      mex-recompile: true
      julia-version: ${{ matrix.julia-version }}

  test-single:
    needs: [precondition, test-matrix]
    name: Run tests on a single configuration
    if: |
      always() &&
      needs.precondition.outputs.code_changed == 'true' && needs.test-matrix.result == 'skipped'
    secrets: inherit
    uses: ./.github/workflows/run-tests-and-build-reusable.yml
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.7', '1.12']
        os: ['windows-latest', 'ubuntu-latest']
    with:
      os: ${{ matrix.os }}
      matlab-version: R2021b
      mex-recompile: true
      julia-version: ${{ matrix.julia-version }}

  summary:
    needs: [test-matrix, test-single]
    name: Test summary
    runs-on: ubuntu-latest
    if: (!cancelled())
    permissions: # Required set of permissions for OICD token and reporting
      contents: read
      checks: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: "results/**/results.xml"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          directory: results

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          use_oidc: true
          directory: results

      - name: Check all jobs
        run: |
          SINGLE_RESULT="${{ needs.test-single.result }}"
          MATRIX_RESULT="${{ needs.test-matrix.result }}"

          if [[ "$SINGLE_RESULT" == "failure" ]] || [[ "$MATRIX_RESULT" == "failure" ]]; then
            echo "❌ Some versions failed CI checks"
            echo "## ❌ CI Summary" >> $GITHUB_STEP_SUMMARY
            echo "Some tests failed. Check individual job results for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [[ "$MATRIX_RESULT" == "skipped" ]]; then
            echo "✅ Single configuration test passed"
            echo "## 🎉 CI Summary" >> $GITHUB_STEP_SUMMARY
            echo "Single configuration test passed. Matrix tests skipped (not an integration or scheduled run)." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Note**: To integrate this PR, the \`integrate\` label must be added to run the full test matrix across all MATLAB versions." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All versions passed CI checks"
            echo "## 🎉 CI Summary" >> $GITHUB_STEP_SUMMARY
            echo "All tests passed across versions." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Full test matrix completed. This PR is ready for integration." >> $GITHUB_STEP_SUMMARY
          fi
