name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Julia
        uses: julia-actions/install-juliaup@8d13b44e0eb1620c4e2d2d0a4ceee7d98100b955 # v3.1.6
        with:
          channel: "1.13"

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      - name: Instantiate documentation environment
        run: julia --project=docs --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Build and deploy documentation
        run: julia --project=docs --startup-file=no docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}